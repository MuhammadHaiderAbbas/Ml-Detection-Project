name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps
      - name: Run tests (SQLite)
        run: python -m pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adaptive_ids
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: adaptive_ids_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptive_ids" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://adaptive_ids:ci_only_password@localhost:5432/adaptive_ids_test
      ADAPTIVE_IDS_DATABASE_URL: postgresql+psycopg://adaptive_ids:ci_only_password@localhost:5432/adaptive_ids_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps
      - name: PostgreSQL client tools (backup and restore tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          pg_dump --version
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: API tests (PostgreSQL)
        run: python -m pytest tests/test_api.py tests/test_drift_api.py tests/test_governance.py tests/test_permissions.py tests/test_accounts.py tests/test_retention.py tests/test_http_hardening.py tests/test_backup.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Audit pinned dependencies for known vulnerabilities
        # Reported, not blocking: ML pins must track the original MSc environment first.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock.txt
