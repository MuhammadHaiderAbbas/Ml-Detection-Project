[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ids"
version = "0.1.0"
description = "Adaptive IDS — ML-based network anomaly detection with concept drift (research engine)"
readme = "README.md"
requires-python = ">=3.10"
# Ranges here; exact tested pins live in requirements.lock.txt. Align these with the
# original MSc environment once its requirements are inventoried (see docs/milestone-1-status.md).
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<2.3",
    "scikit-learn>=1.3,<1.6",
    "scipy>=1.10,<1.14",
    "joblib>=1.3,<1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
adaptive-ids = "adaptive_ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
